services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teamflow
      POSTGRES_PASSWORD: teamflow
      POSTGRES_DB: teamflow
    ports:
      # Host port 5433 avoids clashing with a locally running PostgreSQL on 5432.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teamflow -d teamflow']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['/app/api']
    environment:
      APP_ENV: development
      APP_PORT: '8080'
      # The app connects as the non-superuser teamflow_app role so Row Level
      # Security is enforced. Migrations run separately as the owner (see Makefile).
      DATABASE_URL: postgres://teamflow_app:teamflow_app@postgres:5432/teamflow?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: info
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-teamflow}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      API_KEY_DEFAULT_TTL: ${API_KEY_DEFAULT_TTL:-2160h}
      API_KEY_MAX_TTL: ${API_KEY_MAX_TTL:-8760h}
      INVITATION_BASE_URL: ${INVITATION_BASE_URL:-http://localhost:3000}
      JOB_ENCRYPTION_KEY: ${JOB_ENCRYPTION_KEY:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH_LIMIT: ${RATE_LIMIT_AUTH_LIMIT:-10}
      RATE_LIMIT_AUTH_PERIOD: ${RATE_LIMIT_AUTH_PERIOD:-1m}
      RATE_LIMIT_USER_LIMIT: ${RATE_LIMIT_USER_LIMIT:-300}
      RATE_LIMIT_USER_PERIOD: ${RATE_LIMIT_USER_PERIOD:-1m}
      RATE_LIMIT_API_KEY_LIMIT: ${RATE_LIMIT_API_KEY_LIMIT:-600}
      RATE_LIMIT_API_KEY_PERIOD: ${RATE_LIMIT_API_KEY_PERIOD:-1m}
      INVITATION_TTL: ${INVITATION_TTL:-168h}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['/app/worker']
    environment:
      APP_ENV: development
      # Non-superuser role so RLS is enforced; migrations run as the owner.
      DATABASE_URL: postgres://teamflow_app:teamflow_app@postgres:5432/teamflow?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: info
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-teamflow}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      INVITATION_BASE_URL: ${INVITATION_BASE_URL:-http://localhost:3000}
      INVITATION_TTL: ${INVITATION_TTL:-168h}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
      JOB_ENCRYPTION_KEY: ${JOB_ENCRYPTION_KEY:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH_LIMIT: ${RATE_LIMIT_AUTH_LIMIT:-10}
      RATE_LIMIT_AUTH_PERIOD: ${RATE_LIMIT_AUTH_PERIOD:-1m}
      RATE_LIMIT_USER_LIMIT: ${RATE_LIMIT_USER_LIMIT:-300}
      RATE_LIMIT_USER_PERIOD: ${RATE_LIMIT_USER_PERIOD:-1m}
      RATE_LIMIT_API_KEY_LIMIT: ${RATE_LIMIT_API_KEY_LIMIT:-600}
      RATE_LIMIT_API_KEY_PERIOD: ${RATE_LIMIT_API_KEY_PERIOD:-1m}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_SHUTDOWN_TIMEOUT: ${WORKER_SHUTDOWN_TIMEOUT:-15s}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
      WORKER_RETRY_BASE_DELAY: ${WORKER_RETRY_BASE_DELAY:-30s}
      WORKER_RETRY_MAX_DELAY: ${WORKER_RETRY_MAX_DELAY:-1h}
      # The worker has no API port, so it serves its own metrics endpoint.
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_ADDR: ${METRICS_ADDR:-:9091}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
